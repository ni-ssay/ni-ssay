<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; } h1 span { color: #ff3b30; }
    #status { font-size: 12px; color: #666; min-height: 16px; margin-bottom: 10px; }
    #status.rec { color: #ff3b30; font-weight: 600; }
    button { display: block; width: 100%; margin: 6px 0; padding: 8px; font-size: 13px;
             border: 0; border-radius: 8px; cursor: pointer; background: #eee; }
    button.primary { background: #ff3b30; color: #fff; font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    p.hint { font-size: 11px; color: #888; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1>Flow<span>Scribe</span> Recorder</h1>
  <div id="status"></div>
  <button id="start" class="primary">⏺ Start recording</button>
  <button id="stop">⏹ Stop</button>
  <button id="export">⬇ Export session (.flowscribe.json)</button>
  <button id="clear">🗑 Clear</button>
  <p class="hint">Import on your machine with:<br><code>flowscribe import file.flowscribe.json -o sessions/x</code></p>
  <script src="popup.js"></script>
</body>
</html>
